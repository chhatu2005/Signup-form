
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form with Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="signupForm" onsubmit="return validateForm(event)">
            <h1>Create Account</h1>
            <p class="subtitle">Sign up to get started</p>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" oninput="validateName()">
                <small id="nameError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="Enter your email" oninput="validateEmail()">
                <small id="emailError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" oninput="validatePassword()">
                <small id="passwordError" class="error"></small>

                <div class="strength-container">
                    <div class="strength-bar">
                        <div id="strengthBar"></div>
                    </div>
                    <p id="strengthText">Password strength</p>
                </div>
            </div>

            <button type="submit" id="signupBtn">Create Account</button>

            <p id="successMessage"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
